name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: swift package resolve
      - name: Build package executable (unsigned)
        run: make build
      - name: Run unit tests
        run: make test
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .build/**/*.txt
            ~/Library/Logs/DiagnosticReports/RemoteHub*
          if-no-files-found: ignore
          retention-days: 7
