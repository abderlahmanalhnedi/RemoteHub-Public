name: RemoteHub
options:
  bundleIdPrefix: com.alhnedi
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.14.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.4
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.83.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 3.12.3
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: 1.2.1

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"

targets:
  RemoteHub:
    type: application
    platform: macOS
    sources:
      - path: RemoteHub
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIO
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftCollections
        product: Collections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alhnedi.RemoteHub
        PRODUCT_NAME: RemoteHub
        INFOPLIST_FILE: Configuration/RemoteHub-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    postCompileScripts:
      - name: Embed reviewed FreeRDP payload
        script: |
          "$SRCROOT/Scripts/embed-freerdp.sh"
        basedOnDependencyAnalysis: false

  RemoteHubUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RemoteHubUITests
    dependencies:
      - target: RemoteHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alhnedi.RemoteHubUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: RemoteHub

schemes:
  RemoteHub:
    shared: true
    build:
      targets:
        RemoteHub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteHubUITests
